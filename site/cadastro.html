<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Cadastro - Barbearia</title>
    <link rel="stylesheet" href="style.css">

   

    <script>
        function toggleSenha() {
            const input = document.getElementById("senha");
            const btn = document.querySelector("button");

            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Esconder";
            } else {
                input.type = "password";
                btn.textContent = "Mostrar";
            }
        }
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #ffffff; border-bottom: 2px solid #d4af37;">
        <div class="container-fluid">
    
            <a class="navbar-brand" href="#" style="color: #000000; font-weight: bold;">
                BARBEARIA VICENTINA
            </a>
    
            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false" 
                aria-label="Toggle navigation"
                style="border-color: #d4af37;"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
    
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
    
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" style="color: #000000;">
                            Home
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a class="nav-link" href="#" style="color: #000000;">
                            Link
                        </a>
                    </li>
    
                    <li class="nav-item dropdown">
                        <a 
                            class="nav-link dropdown-toggle" 
                            href="#" 
                            role="button" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false"
                            style="color: #000000;"
                        >
                            Serviços
                        </a>
    
                        <ul class="dropdown-menu" style="background-color: #ffffff; border: 1px solid #d4af37;">
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Corte de Cabelo
                                </a>
                            </li>
    
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Barba
                                </a>
                            </li>
    
                            <li>
                                <hr class="dropdown-divider">
                            </li>
    
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Corte + Barba
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
    
                <form class="d-flex" role="search">
    
                    <input 
                        class="form-control me-2" 
                        type="search" 
                        placeholder="Pesquisar" 
                        aria-label="Pesquisar"
                        style="
                            background-color: #ffffff;
                            color: #000000;
                            border: 1px solid #000000;
                        "
                    />
    
                    <button 
                        class="btn" 
                        type="submit"
                        style="
                            background-color: #d4af37;
                            color: #000000;
                            border: 1px solid #d4af37;
                            font-weight: bold;
                        "
                    >
                        Pesquisar
                    </button>
    
                </form>
    
            </div>
        </div>
    </nav>
    
    

    <div>
        <form id="form_cadastro">
            <p></p> <main class="container"></p>
               <h1>CADASTRO DE CLIENTE</h1>
                <label for="nome">Nome</label>
                <input 
                    type="text" 
                    id="nome" 
                    required 
                    placeholder="Digite seu nome aqui"
                >

                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="digiteseuemail@email.com"
                >

                <label for="celular">Telefone</label>
                <input 
                    type="tel" 
                    id="celular" 
                    required 
                    placeholder="99999-9999"
                >

                <label for="cpf">CPF</label>
                <input 
                    type="text" 
                    id="cpf" 
                    required 
                    placeholder="29210115651"
                >

                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    required 
                    placeholder="Digite aqui sua senha"
                >

                <button type="button" onclick="toggleSenha()">
                    Mostrar
                </button>

                <input 
                    type="submit"
                    id="btn_enviar" 
                    value="Enviar Cadastro"
                >

                <div id="toast" class="toast"></div>

            </main>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
        function pegar_dados(){
            const dados = {
                nome: document.getElementById("nome").value,
                cpf: document.getElementById("cpf").value,
                email: document.getElementById("email").value,
                celular: document.getElementById("celular").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }
        const form = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")
        form.addEventListener("submit", async (event) => {
            event.preventDefault()
            btn_enviar.disabled = true
            btn_enviar.value = "Enviando..."

            const dados = pegar_dados()
            try{
                const resposta = await fetch("http://10.216.243.142:3000/cliente",{
                        method: "POST",
                        headers: {"Content-Type": "application/json"},
                        body: JSON.stringify(dados)
                    }
                )
                if(!resposta.ok) throw new Error("Erro na API")
                alert("O cadastro foi realizado!")
            form.reset()
            }catch (error){
                alert(error)
            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "ENVIAR CADASTRO"
            }
        })
    </script>
</body>
</html>
