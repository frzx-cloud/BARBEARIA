    <div>
        <form id="form_login">
            <p><main class="container"></p>
               <h1>LOGIN</h1>
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="digiteseuemail@email.com" >
                
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    required 
                    placeholder="Digite aqui sua senha"
                >

                <button type="button" onclick="toggleSenha()">
                    Mostrar
                </button>

                <input id="btn_enviar"
                    type="submit" 
                    value="login"
                >

                 <!-- ALERTA TOAST -->

                    <div class="toast-body" id="toast-message">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
        function toggleSenha() {
            const input = document.getElementById("senha");
            const btn = document.querySelector("button");

            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "Esconder";
            } else {
                input.type = "password";
                btn.textContent = "Mostrar";
            }
        }
        function pegar_dados() {
            const dados = {
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            }
            return dados
        }
        const form = document.getElementById("form_login")
        const btn_enviar = document.getElementById("btn_enviar")
        form.addEventListener("submit", async (event) => {
            event.preventDefault() // evita o recarregamento da página
            btn_enviar.disabled = true
            btn_enviar.value = "ENTRANDO..."
            const dados = pegar_dados()
            try {
                const resposta = await fetch(
                    "http://localhost:3000/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(dados)
                    }
                )
                const json_resposta = await resposta.json()
                if (!resposta.ok) {
                    if (resposta.status == 401) {
                        throw new Error(json_resposta.msg)
                    } else {
                        throw new Error("Erro inesperado na API")
                    }
                }
                localStorage.setItem("nome_cliente", json_resposta.nome)
                localStorage.setItem("token", json_resposta.token)
                window.location.href = "index.html"
            } catch (error) {
                mostrarToast("❌ Falha ao enviar. " + error, "bg-danger");

            } finally {
                btn_enviar.disabled = false
                btn_enviar.value = "Entrar"
            }
        })
   </script>
