<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Home</title>

</head>
<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #ffffff; border-bottom: 2px solid #d4af37;">
        <div class="container-fluid">
    
            <a class="navbar-brand" href="#" style="color: #000000; font-weight: bold;">
                BARBEARIA VICENTINA
            </a>
    
            <button 
                class="navbar-toggler" 
                type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false" 
                aria-label="Toggle navigation"
                style="border-color: #d4af37;"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
    
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
    
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#" style="color: #000000;">
                            Home
                        </a>
                    </li>
    
                    <li class="nav-item">
                        <a class="nav-link" href="#" style="color: #000000;">
                            Link
                        </a>
                    </li>
    
                    <li class="nav-item dropdown">
                        <a 
                            class="nav-link dropdown-toggle" 
                            href="#" 
                            role="button" 
                            data-bs-toggle="dropdown" 
                            aria-expanded="false"
                            style="color: #000000;"
                        >
                            Serviços
                        </a>
    
                        <ul class="dropdown-menu" style="background-color: #ffffff; border: 1px solid #d4af37;">
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Corte de Cabelo
                                </a>
                            </li>
    
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Barba
                                </a>
                            </li>
    
                            <li>
                                <hr class="dropdown-divider">
                            </li>
    
                            <li>
                                <a class="dropdown-item" href="#" style="color: #000000;">
                                    Corte + Barba
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
    
                <form class="d-flex" role="search">
    
                    <input 
                        class="form-control me-2" 
                        type="search" 
                        placeholder="Pesquisar" 
                        aria-label="Pesquisar"
                        style="
                            background-color: #ffffff;
                            color: #000000;
                            border: 1px solid #000000;
                        "
                    />
    
                    <button 
                        class="btn" 
                        type="submit"
                        style="
                            background-color: #d4af37;
                            color: #000000;
                            border: 1px solid #d4af37;
                            font-weight: bold;
                        "
                    >
                        Pesquisar
                    </button>
    
                </form>
    
            </div>
        </div>
    </nav>
    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
